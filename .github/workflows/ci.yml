name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Settings switches to its synthetic keyring and SQLite when this is set.
  # The PostgreSQL test job additionally sets TEST_DATABASE_* below.
  AUTOBUDDY_TESTING: "1"

jobs:
  test:
    name: Django tests (PostgreSQL 16)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autobuddy_test
          POSTGRES_USER: autobuddy
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autobuddy -d autobuddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AUTOBUDDY_TESTING: "1"
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_NAME: autobuddy_test
      TEST_DATABASE_USER: autobuddy
      TEST_DATABASE_PASSWORD: test-only-password
      TEST_DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application dependencies
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt is required by the Dockerfile and CI"
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: No missing model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Django tests
        run: python manage.py test tests --noinput

  deploy-config:
    name: Deployment assets and updater tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests_devops/requirements.txt
      - name: Validate shell scripts and Python syntax
        run: |
          bash -n scripts/docker-entrypoint.sh
          bash -n deployment/install.sh
          python -m py_compile scripts/*.py deployment/healthcheck.py
      - name: Lint application and DevOps Python
        run: python -m ruff check autobuddy portal tests scripts tests_devops deployment
      - name: Compose and deployment asset tests
        run: python -m unittest discover -s tests_devops -t . -v
      - name: Validate compose configuration
        run: |
          mkdir -p .ci-secrets
          printf 'ci-only-django-key-not-a-production-secret' > .ci-secrets/django_key
          printf '{"ci": "%s"}' "$(python -c 'import base64; print(base64.b64encode(b"0"*32).decode())')" > .ci-secrets/credential_keys
          printf 'ci-only-password' > .ci-secrets/db_password
          SECRETS_DIR="$PWD/.ci-secrets" \
          RUNTIME_ENV_FILE=deployment/runtime.env.example \
          APP_IMAGE=auto-buddy:ci \
          COMPOSE_PROJECT_NAME=auto-buddy-ci \
          docker compose --project-directory . -f compose.yaml \
            --env-file deployment/runtime.env.example config --quiet
      - name: Migration policy report
        run: python scripts/release_manifest.py policy --format text

  upstream:
    name: Upstream sign-in tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run upstream test suite
        working-directory: workbuddy-auto-signin
        run: python -m unittest discover -s tests -v

  image:
    name: Image build, smoke test and security scan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build image for smoke testing
        run: |
          docker build \
            --build-arg APP_VERSION=ci \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg MIGRATIONS_BACKWARD_COMPATIBLE=true \
            --build-arg MANUAL_APPROVAL_REQUIRED=false \
            --build-arg UPSTREAM_COMMIT="$(git ls-tree HEAD workbuddy-auto-signin | awk '{print $3}')" \
            -t auto-buddy:ci .
      - name: Smoke test image (synthetic settings, no database)
        run: |
          docker run --rm \
            -e AUTOBUDDY_TESTING=1 -e DJANGO_DEBUG=false \
            auto-buddy:ci python manage.py check
          docker run --rm --entrypoint python auto-buddy:ci -c \
            "import autobuddy, portal, django; print('imports ok', django.get_version())"
          if docker run --rm --entrypoint python auto-buddy:ci /app/deployment/healthcheck.py; then
            echo "::error::healthcheck passed without a running server; expected a non-zero exit"
            exit 1
          fi
      - name: Verify image runs as non-root and has no Docker socket
        run: |
          test "$(docker run --rm --entrypoint id auto-buddy:ci -u)" = "10001"
          if docker run --rm --entrypoint sh auto-buddy:ci -c 'test -S /var/run/docker.sock'; then
            echo "::error::docker socket must not be present in the image"
            exit 1
          fi
      - name: Smoke test the real Compose stack with synthetic secrets
        run: |
          set -euo pipefail
          dc=(docker compose --project-directory . -f compose.yaml --env-file .ci-runtime.env)
          cleanup() {
            "${dc[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
            rm -rf .ci-secrets .ci-runtime.env
          }
          trap cleanup EXIT
          rm -rf .ci-secrets .ci-runtime.env

          # Mimic install.sh's host permissions: the directory is the boundary;
          # the bind-mounted files must be readable by the container UIDs.
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          root = Path(".ci-secrets")
          root.mkdir(mode=0o700)
          values = {
              "django_key": "ci-only-" + "x" * 64,
              "credential_keys": json.dumps({"ci": base64.b64encode(b"k" * 32).decode()}),
              "db_password": "ci-only-db-password",
          }
          for name, value in values.items():
              path = root / name
              path.write_text(value, encoding="utf-8")
              path.chmod(0o444)
          root.chmod(0o700)
          PY

          cat > .ci-runtime.env <<'EOF'
          APP_DOMAIN=localhost
          ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=https://localhost
          DATABASE_HOST=db
          DATABASE_PORT=5432
          DATABASE_NAME=autobuddy
          DATABASE_USER=autobuddy
          POSTGRES_DB=autobuddy
          POSTGRES_USER=autobuddy
          TIME_ZONE=Asia/Shanghai
          DJANGO_DEBUG=false
          APP_VERSION=ci
          EOF

          export APP_IMAGE=auto-buddy:ci
          export COMPOSE_PROJECT_NAME=auto-buddy-ci
          export SECRETS_DIR="$PWD/.ci-secrets"
          export RUNTIME_ENV_FILE="$PWD/.ci-runtime.env"

          "${dc[@]}" up -d --no-build db migrate web worker
          "${dc[@]}" wait migrate

          web_id=""
          for _ in $(seq 1 60); do
            web_id="$("${dc[@]}" ps -q web)"
            if [ -n "$web_id" ]; then
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$web_id" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$web_id" ] || [ "$status" != "healthy" ]; then
            echo "::error::web did not become healthy"
            "${dc[@]}" ps
            "${dc[@]}" logs --no-color --tail=200 web worker migrate db
            exit 1
          fi

          worker_id="$("${dc[@]}" ps -q worker)"
          worker_status="$(docker inspect --format '{{.State.Status}}' "$worker_id" 2>/dev/null || true)"
          if [ "$worker_status" != "running" ]; then
            echo "::error::worker is not running: ${worker_status:-missing}"
            "${dc[@]}" logs --no-color --tail=200 worker
            exit 1
          fi

          # Prove the unprivileged app user can read the bind-mounted secrets.
          "${dc[@]}" exec -T web python - <<'PY'
          from pathlib import Path
          for name in ("django_key", "credential_keys", "db_password"):
              value = Path("/run/secrets", name).read_text(encoding="utf-8")
              assert value.strip(), name
          print("container can read all file secrets")
          PY

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auto-buddy:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
