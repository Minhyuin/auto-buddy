name: ${COMPOSE_PROJECT_NAME:-auto-buddy}

# ---------------------------------------------------------------------------
# AutoBuddy production stack.
#
#   db       postgres:16 (internal network only)
#   migrate  one-shot Django migrations; must exit 0 before web/worker start
#   web      gunicorn, static files collected into a tmpfs at startup
#   worker   python manage.py runworker
#   caddy    TLS termination + security headers, publishes 80/443
#
# Application containers are read-only, non-root (uid 10001), have all Linux
# capabilities dropped and no docker socket. Only Caddy publishes ports.
#
# Run from the repository root:
#   docker compose --env-file deployment/runtime.env up -d --build
# The updater runs with an explicit --env-file/--project-directory and
# --no-build so a release tag always runs its immutable image.
# ---------------------------------------------------------------------------

x-app-env: &app-env
  SECRET_KEY_FILE: /run/secrets/django_key
  CREDENTIAL_KEYS_FILE: /run/secrets/credential_keys
  DATABASE_PASSWORD_FILE: /run/secrets/db_password
  APP_VERSION: ${APP_VERSION:-development}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DATABASE_WAIT_SECONDS: ${DATABASE_WAIT_SECONDS:-60}

x-app: &app
  image: ${APP_IMAGE:-auto-buddy:local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-development}
      VCS_REF: ${VCS_REF:-unknown}
      CREATED: ${CREATED:-unknown}
      SOURCE_URL: ${SOURCE_URL:-}
      MIGRATIONS_BACKWARD_COMPATIBLE: ${MIGRATIONS_BACKWARD_COMPATIBLE:-false}
      MANUAL_APPROVAL_REQUIRED: ${MANUAL_APPROVAL_REQUIRED:-true}
      UPSTREAM_COMMIT: ${UPSTREAM_COMMIT:-unknown}
  env_file:
    - ${RUNTIME_ENV_FILE:-./deployment/runtime.env}
  secrets:
    - django_key
    - credential_keys
    - db_password
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autobuddy}
      POSTGRES_USER: ${POSTGRES_USER:-autobuddy}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: "128mb"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *app-env
    restart: "no"
    # The image HEALTHCHECK probes the web port; this one-shot container has no
    # web server, so inherit it only where it is meaningful (web).
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 60s
    networks:
      - backend

  web:
    <<: *app
    command: ["web"]
    environment:
      <<: *app-env
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    tmpfs:
      # read_only rootfs: gunicorn temp files and collectstatic output live here
      - /tmp:size=64m,mode=1777
      - /app/staticfiles:size=256m,uid=10001,gid=10001,mode=0755
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/deployment/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    networks:
      - edge
      - backend

  worker:
    <<: *app
    command: ["python", "manage.py", "runworker"]
    environment:
      <<: *app-env
      AUTH_TEMP_ROOT: /run/auto-buddy
      WORKBUDDY_SCRIPT: /app/workbuddy-auto-signin/signin.py
      HOME: /tmp
    # Do not inherit the image's web HEALTHCHECK: the worker has no HTTP server.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Session material only; mode 0700/uid 10001. Never shared or persisted.
      - /run/auto-buddy:size=64m,mode=0700,uid=10001,gid=10001
    # runworker keeps finishing a Run for up to 600s after SIGTERM.
    stop_grace_period: 650s
    networks:
      - edge
      - backend

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-./deployment/runtime.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Health listener is published on host loopback only.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  django_key:
    file: ${SECRETS_DIR:-./secrets}/django_key
  credential_keys:
    file: ${SECRETS_DIR:-./secrets}/credential_keys
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  # Database-only network with no route to the outside. The db service is
  # attached only here; web and worker also attach to `edge` for outbound
  # WorkBuddy/GitHub traffic but reach PostgreSQL over this internal network.
  # Caddy never joins it.
  backend:
    driver: bridge
    internal: true
